services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-pizza}
      POSTGRES_USER: ${DATABASE_USER:-pizza}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-pizza} -d ${DATABASE_NAME:-pizza}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    command: >
      sh -c "uv run manage.py migrate --noinput &&
             uv run manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEBUG: ${DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-secret-key-change-me}
      DATABASE_NAME: ${DATABASE_NAME:-pizza}
      DATABASE_USER: ${DATABASE_USER:-pizza}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-password}
      DATABASE_HOST: db
      DATABASE_PORT: 5432

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
    environment:
      # The browser resolves this, not the container, so it must be an address
      # reachable from your machine.
      API_URL: ${API_URL:-http://localhost:8000}

volumes:
  pgdata:
