services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-pizza}
      POSTGRES_USER: ${DATABASE_USER:-pizza}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-pizza} -d ${DATABASE_NAME:-pizza}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The image also carries a build of the SPA (see Dockerfile), so
  # http://localhost:8000/ serves the app same-origin, the way a deployment
  # does. That copy is baked at build time: the hot-reload loop is :8080.
  api:
    build: .
    restart: unless-stopped
    command: >
      sh -c "uv run manage.py migrate --noinput &&
             uv run manage.py seed_demo &&
             uv run manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEBUG: ${DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-secret-key-change-me}
      DATABASE_NAME: ${DATABASE_NAME:-pizza}
      DATABASE_USER: ${DATABASE_USER:-pizza}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-password}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DELIVERY_FEE: ${DELIVERY_FEE:-5.00}
      DEMO_USERNAME: ${DEMO_USERNAME:-pizza}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-pizza}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-pizza-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-pizza-admin}
      # Nothing terminates TLS in front of Compose, so Django must not believe
      # X-Forwarded-Proto here. See .env.example.
      TRUST_PROXY: ${TRUST_PROXY:-false}

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
    environment:
      # The browser resolves this, not the container. Leave it empty and the
      # app calls port 8000 on whatever host it was loaded from, which works
      # from this machine and from a phone on the same network alike. Set it
      # only when the API lives somewhere else.
      API_URL: ${API_URL:-}

  # Hot reload without rebuilding the image: docker compose --profile dev up.
  # It takes the same port as `frontend`, so only one of them runs at a time.
  # public/config.js already points at localhost:8000, so nothing regenerates
  # it here.
  frontend-dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host --port 8080"
    volumes:
      - ./frontend:/app
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  pgdata:
