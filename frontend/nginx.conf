server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The app is a hash-routed single page; everything else is a static asset.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # config.js is rewritten per-environment, so it must never be cached.
    location = /static/js/config.js {
        add_header Cache-Control "no-store";
    }
}
