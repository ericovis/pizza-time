server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The app is a hash-routed single page; everything else is a static asset.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # config.js is rewritten per-environment on container start, so it must
    # never be cached.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Vite fingerprints everything under /assets/, so it can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
