<!doctype html>
<html lang="en" style="background:#1a0b2e">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a0b2e" />
    <meta name="description" content="Pizza Time — eight slices, up to eight flavors, five dollar delivery." />
    <title>Pizza Time</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Self-hosted Unbounded + Rubik (latin). Loaded before the bundle so the
         display face is ready when the first screen paints. -->
    <link rel="preload" href="/fonts/unbounded-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/rubik-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <!-- Runtime configuration. Regenerated inside the container from $API_URL,
         so one image can point at any API. Must load before the bundle. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
